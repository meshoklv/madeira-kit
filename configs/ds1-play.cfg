# DS1 Remastered "play" profile for Madeira (reference). Use your own, legally owned copy.
# Needs a recent Madeira (upstream d5a8e0a or later): MADEIRA_PAD_EARLY_SLOT and
# MADEIRA_CONTROLS_XBOX_DEFAULT only exist there.
# Edit the folder to wherever YOU put the game inside the Madeira container (see GAME_DIR in scripts/config.env).
exe = C:\Games\DSR\DarkSoulsRemastered.exe
env.SteamAppId = 570940
env.SteamGameId = 570940
# Player 1 connected from the very first second: the game only looks for a pad at startup
env.MADEIRA_PAD_EARLY_SLOT = 1
# Built-in Xbox on-screen layout when you have no layout of your own yet
env.MADEIRA_CONTROLS_XBOX_DEFAULT = 1
# The game drives Xbox pads through XInput. Madeira v9+ loads its own builtin xinput even if the game folder
# ships a copy (wine PR #19), so no extra override is needed.
