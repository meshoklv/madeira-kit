# DS3 "H2" performance package - EXPERIMENTAL, needs patched builds.
# Reconstructed from the notes in docs/perf/ (docs/perf/DS3-G1-NEXT.md, DS3-CORES.md, DS3-HOT-SMC-V2.md,
# DS3-CS-FASTPATH.md); it is not byte-identical to the file used for the measurements.
# Measured by the author on one iPhone Air: heavy scenes median 16.9 -> 21.5 (G1) -> 36.7 FPS (H2, first minutes),
# 32-34 FPS after the phone heats up. Single device, single run each; treat as a report, not a guarantee.
#
# REQUIRES (all keys are no-ops without them; see patches/open/):
#   - FEX xtajit64.dll with hot-SMC v2        (patches/open/fex-hot-smc-pages.patch + fex-hot-smc-v2.patch)
#   - ntdll.dll with CS/TLS fast path + lean sync (patches/open/wine-cs-x64-fastpath.patch + wine-g1next-sync-lean.patch)
#   - d3d11.dll with DXMT dyn-keep            (patches/open/dxmt-g1next-dyn-keep.patch)
#   - Madeira with MADEIRA_THREAD_QOS         (willfaust/Madeira PR #401)
# Roll back: delete the lines below the "H2" marker, or swap the stock DLLs back.

# --- base (same as ds3-ux.cfg, without the FPS cap so you can see the real numbers) ---
pool-split = 1
pool-low = 1
env.MADEIRA_X64_IMAGE_NOCOPY = 1
env.MADEIRA_LOCK_ORPHAN = stamped
env.MADEIRA_PAD_EARLY_SLOT = 1
env.MADEIRA_CONTROLS_XBOX_DEFAULT = 1
env.MADEIRA_EC_HOOK_TRACE = 0
env.MADEIRA_LEAN_DIAG = 1
env.MADEIRA_ECO_NATIVE = 1

# --- G1 ---
inproc-sync = 1
env.MADEIRA_CS_X64 = 1
env.FEX_HOT_SMC_PAGES = 2

# --- H1 ---
env.DXMT_DYN_KEEP = 1024
env.DXMT_CMDLIST_KEEP_BLOCK = 1
env.MADEIRA_TLS_X64 = 1
env.MADEIRA_SYNC_LEAN = 1

# --- H2 ---
env.MADEIRA_THREAD_QOS = GXWorker*=user-initiated;FD4JobWorker*=utility;Core.Res.*=utility;EzWorkPool*=utility;Bnd4FSAsync*=utility;NexusRevolution*=utility;HkAiThread*=utility;CSChrBackInitialize*=utility;FaceGenMan*=utility
