# DS3 (Steam, installed through Madeira Dock) - safe quality-of-life set. Paste into
# Game details > Advanced > "This game's config". Measured effect: even frame pacing, less heat.
# Documented in docs/perf/DS3-UX-SETTINGS.md (every line has a reason and a rollback).
pool-split = 1
pool-low = 1
env.MADEIRA_X64_IMAGE_NOCOPY = 1
env.MADEIRA_LOCK_ORPHAN = stamped
env.MADEIRA_PAD_EARLY_SLOT = 1
env.MADEIRA_CONTROLS_XBOX_DEFAULT = 1
env.MADEIRA_EC_HOOK_TRACE = 0
# Flat 50 ms frames instead of 18-25 FPS jumping around; less CPU work -> less heat
env.MADEIRA_FPS_CAP = 20
# No sampling that stops all threads every 20 s (micro-freezes)
env.MADEIRA_LEAN_DIAG = 1
# Service threads (JIT pool warm-up, pointer healer) go to the efficiency cores
env.MADEIRA_ECO_NATIVE = 1
